version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let new releases soak before proposing them (supply-chain hygiene)
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let new releases soak before proposing them (supply-chain hygiene)
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let new releases soak before proposing them (supply-chain hygiene)
